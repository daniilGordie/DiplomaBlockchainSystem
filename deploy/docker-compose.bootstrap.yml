services:
  bootstrap-node:
    build:
      context: ..
      dockerfile: Blockchain.Node/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Network__Id: ${NETWORK_ID:-nexus-main}
      Network__BootstrapHttpUrl: ${NETWORK_BOOTSTRAP_HTTP_URL:-}
      Network__BootstrapGrpcUrl: ${NETWORK_BOOTSTRAP_GRPC_URL:-}
      Network__BootstrapIrohUrl: ${NETWORK_BOOTSTRAP_IROH_URL:-}
      Network__TrustedBootstrapNodeId: ${NETWORK_TRUSTED_BOOTSTRAP_NODE_ID:-}
      Network__TrustedBootstrapFingerprint: ${NETWORK_TRUSTED_BOOTSTRAP_FINGERPRINT:-}
      Kestrel__Endpoints__Public__Url: http://+:5041
      Kestrel__Endpoints__Public__Protocols: Http1
      Kestrel__Endpoints__P2PGrpc__Url: http://+:5042
      Kestrel__Endpoints__P2PGrpc__Protocols: Http2
      ConnectionStrings__DefaultNodeDb: ${NODE_DB_PATH:-/data/bootstrap-node.db}
      Node__Role: ${NODE_ROLE:-Bootstrap}
      NodeDbPassword: ${NODE_DB_PASSWORD}
      NodeAdminToken: ${NODE_ADMIN_TOKEN}
      WebhookSecret: ${WEBHOOK_SECRET}
      OraclePublicKey: ${ORACLE_PUBLIC_KEY}
      OraclePrivateKeyPassword: ${ORACLE_PRIVATE_KEY_PASSWORD}
      OracleKeyPath: ${ORACLE_KEY_PATH:-/data/oracle_key.dat}
      Consensus__EnableProofOfContributionValidation: ${CONSENSUS_ENABLE_POC:-false}
      Consensus__RequireProofOfWork: ${CONSENSUS_REQUIRE_PROOF_OF_WORK:-true}
      Consensus__AcceptP2PBlocksAsFinal: ${CONSENSUS_ACCEPT_P2P_BLOCKS_AS_FINAL:-true}
      Consensus__FinalityMode: ${CONSENSUS_FINALITY_MODE:-Immediate}
      Consensus__ProducerKeyPath: ${CONSENSUS_PRODUCER_KEY_PATH:-}
      Consensus__ProducerPrivateKeyPassword: ${CONSENSUS_PRODUCER_KEY_PASSWORD:-}
      Raft__Transport: ${RAFT_TRANSPORT:-Tcp}
      Raft__NodeId: ${RAFT_NODE_ID:-}
      Raft__PublicEndPoint: ${RAFT_PUBLIC_ENDPOINT:-}
      Raft__IrohNodeId: ${RAFT_IROH_NODE_ID:-}
      Raft__IrohControlEndPoint: ${RAFT_IROH_CONTROL_ENDPOINT:-127.0.0.1:60411}
      Raft__IrohNodeListenEndPoint: ${RAFT_IROH_NODE_LISTEN_ENDPOINT:-127.0.0.1:60410}
      Raft__LogPath: ${RAFT_LOG_PATH:-/data/raft-log}
      Raft__UsePersistentMembership: ${RAFT_USE_PERSISTENT_MEMBERSHIP:-true}
      Raft__MembershipPath: ${RAFT_MEMBERSHIP_PATH:-/data/raft-membership}
      Raft__SnapshotPath: ${RAFT_SNAPSHOT_PATH:-/data/raft-snapshots}
      Raft__Peers__0__Id: ${RAFT_PEER_ID:-}
      Raft__Peers__0__EndPoint: ${RAFT_PEER_ENDPOINT:-}
      P2P__NodeRole: Bootstrap
      P2P__NodeId: ${P2P_NODE_ID}
      P2P__PublicUrl: ${P2P_PUBLIC_URL}
      P2P__SyncToken: ${P2P_SYNC_TOKEN}
      P2P__RegistrationToken: ${P2P_REGISTRATION_TOKEN:-}
      P2P__IdentityKeyPath: ${P2P_IDENTITY_KEY_PATH:-/data/node-identity.p256.key}
      P2P__DiscoveryIntervalSeconds: ${P2P_DISCOVERY_INTERVAL_SECONDS:-60}
      P2P__AllowRegistrationTokenFallback: ${P2P_ALLOW_REGISTRATION_TOKEN_FALLBACK:-false}
      P2P__MaxRegisteredPeers: ${P2P_MAX_REGISTERED_PEERS:-5000}
      P2P__MaxRegistrationsPerMinutePerAddress: ${P2P_MAX_REGISTRATIONS_PER_MINUTE_PER_ADDRESS:-30}
      P2P__Iroh__Enabled: ${IROH_ENABLED:-false}
      P2P__Iroh__SidecarUrl: ${IROH_SIDECAR_URL:-http://iroh-sidecar:49152}
      P2P__Iroh__LocalApiToken: ${IROH_LOCAL_API_TOKEN:-}
      NodeVersion__UpdateManifestUrl: ${UPDATE_MANIFEST_URL:-}
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes:
      - bootstrap-data:/data
    ports:
      - "${NODE_HTTP_PORT:-7041}:5041"
      - "${NODE_GRPC_PORT:-7141}:5042"
      - "${RAFT_PORT:-6041}:${RAFT_PORT:-6041}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5041/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  bootstrap-data:
