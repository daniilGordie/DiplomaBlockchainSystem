<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Web3 Workplace</title>
    <base href="/" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="Blockchain.UI.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body style="background-color: #121212; margin: 0;">

    <div id="app">
        <div style="text-align: center; margin-top: 20%; font-family: monospace; color: white;">
            <h2>🚀 Loading Nexus Web3 Client...</h2>
            <p>Initializing cryptography modules</p>
        </div>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
