services:
  bootstrap-node:
    build:
      context: .
      dockerfile: Blockchain.Node/Dockerfile
    environment:
      Kestrel__Endpoints__Public__Url: http://+:5041
      Kestrel__Endpoints__Public__Protocols: Http1
      Kestrel__Endpoints__P2PGrpc__Url: http://+:5042
      Kestrel__Endpoints__P2PGrpc__Protocols: Http2
      ConnectionStrings__DefaultNodeDb: /data/bootstrap-node.db
      OraclePublicKey: auto
      WebhookSecret: demo-webhook-secret
      NodeDbPassword: demo-node-db-password
      NodeAdminToken: demo-admin-token
      P2P__NodeRole: Bootstrap
      P2P__NodeId: bootstrap-node
      P2P__PublicUrl: http://bootstrap-node:5041
      P2P__SyncToken: demo-sync-token
      P2P__RegistrationToken: demo-registration-token
      P2P__DiscoveryIntervalSeconds: 15
      P2P__IdentityKeyPath: /data/node-identity.p256.key
      P2P__AllowRegistrationTokenFallback: "false"
      P2P__MaxRegisteredPeers: 1000
      P2P__MaxRegistrationsPerMinutePerAddress: 60
      P2P__Iroh__Enabled: "false"
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes:
      - bootstrap-data:/data
    ports:
      - "7041:5041"
      - "7141:5042"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5041/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  full-node-a:
    build:
      context: .
      dockerfile: Blockchain.Node/Dockerfile
    environment:
      Kestrel__Endpoints__Public__Url: http://+:5041
      Kestrel__Endpoints__Public__Protocols: Http1
      Kestrel__Endpoints__P2PGrpc__Url: http://+:5042
      Kestrel__Endpoints__P2PGrpc__Protocols: Http2
      ConnectionStrings__DefaultNodeDb: /data/full-node-a.db
      OraclePublicKey: auto
      WebhookSecret: demo-webhook-secret
      NodeDbPassword: demo-node-db-password
      NodeAdminToken: demo-admin-token
      P2P__NodeRole: Full
      P2P__NodeId: full-node-a
      P2P__PublicUrl: ""
      P2P__BootstrapPeers__0: http://bootstrap-node:5042
      P2P__SyncToken: demo-sync-token
      P2P__RegistrationToken: demo-registration-token
      P2P__DiscoveryIntervalSeconds: 15
      P2P__IdentityKeyPath: /data/node-identity.p256.key
      P2P__AllowRegistrationTokenFallback: "false"
      P2P__Iroh__Enabled: "true"
      P2P__Iroh__SidecarUrl: http://full-node-a-iroh:49152
      P2P__Iroh__LocalApiToken: demo-iroh-local-token
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes:
      - full-node-a-data:/data
    depends_on:
      bootstrap-node:
        condition: service_healthy
      full-node-a-iroh:
        condition: service_healthy
    ports:
      - "7042:5041"
      - "7142:5042"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5041/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  full-node-a-iroh:
    build:
      context: .
      dockerfile: iroh-sidecar/Dockerfile
    environment:
      NEXUS_IROH_LISTEN: 0.0.0.0:49152
      NEXUS_NODE_URL: http://full-node-a:5041
      NEXUS_IROH_TOKEN: demo-iroh-local-token
      NEXUS_IROH_SECRET_KEY_PATH: /data/iroh-secret.key
      NEXUS_IROH_RELAY_MODE: default
      RUST_LOG: info,nexus_iroh_sidecar=debug
    volumes:
      - full-node-a-iroh-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:49152/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  full-node-b:
    build:
      context: .
      dockerfile: Blockchain.Node/Dockerfile
    environment:
      Kestrel__Endpoints__Public__Url: http://+:5041
      Kestrel__Endpoints__Public__Protocols: Http1
      Kestrel__Endpoints__P2PGrpc__Url: http://+:5042
      Kestrel__Endpoints__P2PGrpc__Protocols: Http2
      ConnectionStrings__DefaultNodeDb: /data/full-node-b.db
      OraclePublicKey: auto
      WebhookSecret: demo-webhook-secret
      NodeDbPassword: demo-node-db-password
      NodeAdminToken: demo-admin-token
      P2P__NodeRole: Full
      P2P__NodeId: full-node-b
      P2P__PublicUrl: ""
      P2P__BootstrapPeers__0: http://bootstrap-node:5042
      P2P__SyncToken: demo-sync-token
      P2P__RegistrationToken: demo-registration-token
      P2P__DiscoveryIntervalSeconds: 15
      P2P__IdentityKeyPath: /data/node-identity.p256.key
      P2P__AllowRegistrationTokenFallback: "false"
      P2P__Iroh__Enabled: "true"
      P2P__Iroh__SidecarUrl: http://full-node-b-iroh:49152
      P2P__Iroh__LocalApiToken: demo-iroh-local-token
      Logging__LogLevel__System.Net.Http.HttpClient: Warning
    volumes:
      - full-node-b-data:/data
    depends_on:
      bootstrap-node:
        condition: service_healthy
      full-node-b-iroh:
        condition: service_healthy
    ports:
      - "7043:5041"
      - "7143:5042"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5041/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  full-node-b-iroh:
    build:
      context: .
      dockerfile: iroh-sidecar/Dockerfile
    environment:
      NEXUS_IROH_LISTEN: 0.0.0.0:49152
      NEXUS_NODE_URL: http://full-node-b:5041
      NEXUS_IROH_TOKEN: demo-iroh-local-token
      NEXUS_IROH_SECRET_KEY_PATH: /data/iroh-secret.key
      NEXUS_IROH_RELAY_MODE: default
      RUST_LOG: info,nexus_iroh_sidecar=debug
    volumes:
      - full-node-b-iroh-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:49152/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bootstrap-data:
  full-node-a-data:
  full-node-a-iroh-data:
  full-node-b-data:
  full-node-b-iroh-data:
